name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      playwright:
        description: Run Playwright browser tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          from pathlib import Path
          lines = [
              line
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if not line.startswith("PySide6")
          ]
          Path("requirements-ci.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m pip install -r requirements-ci.txt
      - name: Run pytest
        run: python -m pytest
      - name: Guardrail scan
        run: python scripts/check_guardrails.py --strict
      - name: Inspection corpus
        run: python scripts/inspect_repo.py corpus

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and check bundle budgets
        run: npm run build && npm run build:check

  playwright:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.playwright }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          from pathlib import Path
          lines = [
              line
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if not line.startswith("PySide6")
          ]
          Path("requirements-ci.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m pip install -r requirements-ci.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright
        run: npm run test:e2e
